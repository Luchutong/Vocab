{% extends "base.html" %}
{% block title %}找回密码 - 六级词汇复习系统{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="card auth-card">
    <h1>找回密码</h1>
    <p class="muted">输入注册邮箱，我们会发送一封有效期为 1 小时的重置邮件。</p>
    <form method="post" class="stack-form">
      <label for="email">天津大学邮箱</label>
      <input id="email" name="email" type="email" required autofocus>
      <button class="button primary wide" type="submit">发送重置邮件</button>
    </form>
    <div class="auth-links"><a href="{{ url_for('login') }}">返回登录</a></div>
  </div>
</section>
{% endblock %}
